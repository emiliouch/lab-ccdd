table: silver.customers
purpose: Conservar clientes con customer_id unico antes de resolver personas reales en Gold.
grain: Una fila por customer_id.
primary_key: [customer_id]
owner: Equipo de datos Pudubella
lineage: [bronze.customers]
classification: interno
required_columns:
  - customer_id
  - customer_unique_id
column_types:
  customer_id: string
  customer_unique_id: string
allow_empty: false
constraints:
  customer_id:
    nullable: false
    unique: true
  customer_unique_id:
    nullable: false
