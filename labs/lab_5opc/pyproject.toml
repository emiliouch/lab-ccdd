[project]
name = "gradeslab"
version = "0.1.0"
description = "Proyecto del Laboratorio 5: ordenar las notas de la Universidad de la Cachaña"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.2",
    "numpy>=2.4.3",
    "plotly>=6.9.0",
    "polars>=1.44.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext==1.19.5",
    "nbformat>=5.10",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "etapa1: pruebas de lectura y reconstrucción de las fuentes",
    "etapa2: pruebas de uniones y auditoría de claves",
    "etapa3: pruebas de formatos ancho y largo",
    "etapa4: pruebas de métricas y agrupaciones",
    "etapa5: pruebas de visualizaciones",
    "etapa6: pruebas del pipeline lazy y exportación",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "PTH"]
ignore = ["E501", "RUF003"]
